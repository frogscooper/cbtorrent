[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cbtorrent"
version = "0.2.0"
description = "An instrumented Python BitTorrent research client"
requires-python = ">=3.11"
dependencies = []
readme = "README.md"
license = {text = "MIT"}

[project.scripts]
cbtorrent = "cbtorrent.__main__:main"

[tool.setuptools.packages.find]
include = ["cbtorrent*"]
