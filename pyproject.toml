[project]
name = "mltorrent"
version = "0.1.0"
description = "BitTorrent client with online ML peer ranking"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
mltorrent = "mltorrent.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mltorrent*"]
